<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Todo Mundo Fit</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
padding:15px;
margin:0
}
.card{
background:#1e293b;
padding:15px;
margin-bottom:15px;
border-radius:15px
}
input,button{
width:100%;
padding:10px;
margin:5px 0;
border-radius:10px;
border:none
}
button{
background:#22c55e;
color:white;
font-weight:bold
}
canvas{
background:white;
border-radius:10px;
margin-top:10px
}
.logo{
font-size:28px;
font-weight:bold;
text-align:center;
margin-bottom:20px
}
</style>
</head>

<body>

<div class="logo">🏋️ TODO MUNDO FIT</div>

<div class="card">
<h3>Dados</h3>

<input id="peso" type="number" placeholder="Peso kg">

<input id="altura" type="number" step="0.01" placeholder="Altura m">

<input id="metaPeso" type="number" placeholder="Meta kg">

<button onclick="calcular()">Calcular</button>

<div id="resultado"></div>
</div>

<div class="card">
<h3>💧 Água</h3>

<input id="metaAgua" type="number" step="0.1" placeholder="Meta Litros">

<input id="agua" type="number" step="0.1" placeholder="Consumido Hoje">

<button onclick="salvarAgua()">Salvar Água</button>

<div id="aguaInfo"></div>

<h2 id="streak">🔥 0 dias</h2>
</div>

<div class="card">
<h3>📈 Evolução Peso</h3>
<canvas id="graficoPeso"></canvas>
</div>

<div class="card">
<h3>💧 Evolução Água</h3>
<canvas id="graficoAgua"></canvas>
</div>

<div class="card">
<h3>💡 Dica do Dia</h3>
<div id="dica"></div>
</div>

<div class="card">
<h3>🔥 Exercícios do Dia</h3>
<div id="treino"></div>
</div>

<script>

const dicas=[
"Beba mais água",
"Evite refrigerante",
"Caminhe 30 minutos",
"Durma 8 horas",
"Coma frutas",
"Evite ultraprocessados"
];

const exercicios=[
"Agachamento",
"Flexão",
"Prancha",
"Polichinelo",
"Abdominal",
"Afundo",
"Burpee"
];

carregar();

function calcular(){

let peso=parseFloat(pesoEl().value);
let altura=parseFloat(alturaEl().value);
let meta=parseFloat(metaPesoEl().value);

if(!peso || !altura) return;

let imc=peso/(altura*altura);

let status="";

if(imc<18.5) status="Abaixo do Peso";
else if(imc<25) status="Peso Ideal";
else if(imc<30) status="Sobrepeso";
else status="Obesidade";

let massa=(peso*0.75).toFixed(1);

resultado.innerHTML=`
IMC: <b>${imc.toFixed(1)}</b><br>
Status: <b>${status}</b><br>
Massa Magra: <b>${massa}kg</b><br>
Meta: <b>${meta}kg</b>
`;

localStorage.setItem("peso",peso);
localStorage.setItem("altura",altura);
localStorage.setItem("metaPeso",meta);

}

function salvarAgua(){

let litros=parseFloat(document.getElementById("agua").value);

let meta=parseFloat(document.getElementById("metaAgua").value);

if(isNaN(meta) || meta<1 || meta>10){
alert("Meta entre 1 e 10 litros");
return;
}

if(isNaN(litros) || litros<0 || litros>15){
alert("Consumo entre 0 e 15 litros");
return;
}

localStorage.setItem("metaAgua",meta);

let hist=
JSON.parse(localStorage.getItem("historicoAgua"))
|| [];

let hoje=
new Date().toISOString().split("T")[0];

let existente=
hist.find(x=>x.data===hoje);

if(existente){
existente.litros=litros;
}else{
hist.push({
data:hoje,
litros:litros
});
}

localStorage.setItem(
"historicoAgua",
JSON.stringify(hist)
);

aguaInfo.innerHTML=
`${litros}L de ${meta}L`;

calcularStreak();
graficoAgua();
}

function salvarPeso(){

let peso=parseFloat(
pesoEl().value
);

if(!peso) return;

let hist=
JSON.parse(
localStorage.getItem("historicoPeso")
)||[];

hist.push({
data:new Date().toLocaleDateString(),
peso:peso
});

localStorage.setItem(
"historicoPeso",
JSON.stringify(hist)
);

graficoPeso();
}

setInterval(salvarPeso,86400000);

function graficoPeso(){

let hist=
JSON.parse(
localStorage.getItem("historicoPeso")
)||[];

new Chart(
document.getElementById("graficoPeso"),
{
type:'line',
data:{
labels:hist.map(x=>x.data),
datasets:[{
label:'Peso',
data:hist.map(x=>x.peso),
borderColor:'green'
}]
}
});
}

function graficoAgua(){

let hist=
JSON.parse(
localStorage.getItem("historicoAgua")
)||[];

let meta=
parseFloat(
localStorage.getItem("metaAgua")
)||3;

new Chart(
document.getElementById("graficoAgua"),
{
data:{
labels:hist.map(x=>x.data),
datasets:[
{
type:'bar',
label:'Água',
data:hist.map(x=>x.litros),
backgroundColor:'#3b82f6'
},
{
type:'line',
label:'Meta',
data:new Array(hist.length).fill(meta),
borderColor:'green',
borderDash:[5,5]
}
]
}
});
}

function calcularStreak(){

let hist=
JSON.parse(
localStorage.getItem("historicoAgua")
)||[];

let meta=
parseFloat(
localStorage.getItem("metaAgua")
)||3;

let dias=hist.filter(
x=>x.litros>=meta
).length;

streak.innerHTML=
"🔥 "+dias+" dias";
}

function gerarDica(){

dica.innerHTML=
dicas[
Math.floor(
Math.random()*dicas.length
)
];

}

function gerarTreino(){

let html="";

for(let i=0;i<3;i++){

html+="✅ "+
exercicios[
Math.floor(
Math.random()*exercicios.length
)
]+"<br>";

}

treino.innerHTML=html;
}

function carregar(){

pesoEl().value=
localStorage.getItem("peso") || "";

alturaEl().value=
localStorage.getItem("altura") || "";

metaPesoEl().value=
localStorage.getItem("metaPeso") || "";

document.getElementById("metaAgua").value=
localStorage.getItem("metaAgua") || 3;

gerarDica();
gerarTreino();
calcularStreak();

}

function pesoEl(){return document.getElementById("peso")}
function alturaEl(){return document.getElementById("altura")}
function metaPesoEl(){return document.getElementById("metaPeso")}

</script>

</body>
</html>
